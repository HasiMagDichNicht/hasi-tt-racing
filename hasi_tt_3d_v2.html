<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HASI TT 8N Racing 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87c8ef;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:16px 18px auto;display:flex;justify-content:space-between;z-index:10;color:#fff;font-weight:800;pointer-events:none}
.box{background:#071018cc;border:1px solid #ffffff30;border-radius:14px;padding:10px 14px;text-shadow:0 2px 3px #000}
#speed{font-size:24px}
#help{position:fixed;left:18px;bottom:18px;z-index:10;color:#fff;background:#071018bb;padding:9px 13px;border-radius:12px;font-size:13px}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:20}
.card{width:430px;max-width:90vw;background:#0a1119ee;color:#fff;border:1px solid #ffffff25;border-radius:24px;padding:30px;text-align:center;box-shadow:0 30px 90px #000b}
.card h1{font-size:38px;margin:0 0 8px}.card p{opacity:.8;line-height:1.5}
button{border:0;border-radius:13px;padding:14px 28px;font-size:17px;font-weight:900;cursor:pointer}
#count{font-size:54px;font-weight:900;height:64px}
#msg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:15;color:#fff;font-size:58px;font-weight:900;text-shadow:0 4px 15px #000;display:none}
</style>
</head>
<body>
<div id="hud">
  <div class="box">🏁 Runde <span id="lap">1/3</span> · <span id="timer">0.0</span>s</div>
  <div class="box"><span id="speed">0</span> km/h · <span id="pos">1/4</span></div>
</div>
<div id="help">W/↑ Gas · S/↓ Bremse · A/D Lenken · R Dach · N Nacht · ESC Pause</div>
<div id="msg"></div>
<div id="start"><div class="card">
  <h1>🏁 HASI TT 8N</h1>
  <p>3D Roadster Racing<br>Schwarzer TT 8N · rote Bremssättel · Überrollbügel · HASI</p>
  <div id="count"></div><button id="go">START</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bc9ee);
scene.fog=new THREE.Fog(0x8bc9ee,70,260);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
camera.position.set(0,3.2,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfe5ff,0x35522c,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-40,70,35);sun.castShadow=true;scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshStandardMaterial({color:0x4f8d48,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

function mat(c,rough=.65,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
const asphalt=mat(0x2c2e31), white=mat(0xf2eee0), red=mat(0xd7192b), black=mat(0x090a0b), glass=mat(0x182b35,.2,.2), silver=mat(0xb8b9b8,.25,.8), tire=mat(0x090909), redCal=mat(0xc91422,.45,.1);

function box(w,h,d,m,x,y,z,rx=0,ry=0,rz=0){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.rotation.set(rx,ry,rz);o.castShadow=true;o.receiveShadow=true;return o;
}

// Curved looping track made from segments
const roadGroup=new THREE.Group();scene.add(roadGroup);
const trackRadius=72, trackWidth=12, segments=96;
const roadPoints=[];
for(let i=0;i<segments;i++){
 const a=i/segments*Math.PI*2;
 roadPoints.push(new THREE.Vector3(Math.cos(a)*trackRadius,0,Math.sin(a)*trackRadius));
}
for(let i=0;i<segments;i++){
 const a=i/segments*Math.PI*2, next=(i+1)/segments*Math.PI*2;
 const mid=(a+next)/2;
 const len=2*Math.PI*trackRadius/segments+0.7;
 const road=box(trackWidth,.12,len,asphalt,Math.cos(mid)*trackRadius,.02,Math.sin(mid)*trackRadius,0,-mid,0);
 roadGroup.add(road);
 for(let side of [-1,1]){
   const x=Math.cos(mid)*(trackRadius+side*(trackWidth/2+.7));
   const z=Math.sin(mid)*(trackRadius+side*(trackWidth/2+.7));
   const curb=box(1.15,.13,len,red,x,.10,z,0,-mid,0);roadGroup.add(curb);
   const whiteBlock=box(1.15,.135,len/2,white,x,.105,z,0,-mid,0);
   whiteBlock.position.z+=side*0.01;
   if(i%2===1)roadGroup.add(whiteBlock);
 }
 // dashed center line
 if(i%3===0){
  const mark=box(.16,.03,1.8,white,Math.cos(mid)*trackRadius,.10,Math.sin(mid)*trackRadius,0,-mid,0);roadGroup.add(mark);
 }
}

function tree(x,z,s=1){
 const g=new THREE.Group();
 g.position.set(x,0,z);g.scale.setScalar(s);
 const trunk=box(.35,2,.35,mat(0x5a3823),0,1,0);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(2.1,10,8),mat(0x1e5d2b));crown.position.y=3.2;crown.castShadow=true;
 g.add(trunk,crown);scene.add(g);
}
for(let i=0;i<42;i++){
 const a=i/42*Math.PI*2;
 const r=trackRadius+16+(i%3)*7;
 tree(Math.cos(a)*r,Math.sin(a)*r,0.7+(i%4)*.08);
}

// mountains
for(let i=0;i<9;i++){
 const a=i/9*Math.PI*2, r=125;
 const h=20+(i%4)*9;
 const m=new THREE.Mesh(new THREE.ConeGeometry(24,h,4),mat(0x7d8887));
 m.position.set(Math.cos(a)*r,h/2-1,Math.sin(a)*r);m.rotation.y=a+.78;scene.add(m);
}

function makeTT(color=0x080909){
 const g=new THREE.Group();
 const body=box(3.05,.72,5.1,mat(color,.38,.55),0,1.05,0);
 body.scale.z=1;g.add(body);
 const nose=box(2.75,.38,1.5,mat(color,.35,.5),0,1.15,-2.25);
 g.add(nose);
 const cabin=new THREE.Mesh(new THREE.CapsuleGeometry(1.18,.9,6,16),glass);
 cabin.scale.set(1,0.62,1.35);cabin.position.set(0,1.68,.15);g.add(cabin);
 const rear=box(2.55,.12,.18,black,0,1.65,2.48);g.add(rear);
 // roll hoops
 for(const x of [-.72,.72])g.add(box(.13,.75,.16,silver,x,2.0,.72));
 // wheels
 for(const x of [-1.38,1.38])for(const z of [-1.65,1.65]){
   const w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.30,24),tire);
   w.rotation.z=Math.PI/2;w.position.set(x,0.65,z);w.castShadow=true;g.add(w);
   const rim=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.32,20),silver);rim.rotation.z=Math.PI/2;rim.position.set(x,0.65,z);g.add(rim);
   const cal=new THREE.Mesh(new THREE.BoxGeometry(.12,.3,.2),redCal);cal.position.set(x*1.01,.72,z);g.add(cal);
 }
 // rear lamps
 for(const x of [-.82,.82])g.add(box(.52,.16,.12,mat(0x8f0710,.35),x,1.22,2.57));
 // plate
 const plate=box(.78,.20,.05,white,0,.98,2.62);g.add(plate);
 const text=document.createElement('canvas');text.width=256;text.height=64;const ctx=text.getContext('2d');
 ctx.fillStyle='#fff';ctx.fillRect(0,0,256,64);ctx.fillStyle='#111';ctx.font='bold 38px Arial';ctx.textAlign='center';ctx.fillText('HASI',128,45);
 const tex=new THREE.CanvasTexture(text),pm=new THREE.MeshBasicMaterial({map:tex});const pmesh=new THREE.Mesh(new THREE.PlaneGeometry(.76,.19),pm);pmesh.position.set(0,.98,2.655);g.add(pmesh);
 // front headlights, bumper/grille
 for(const x of [-.9,.9])g.add(box(.58,.18,.08,mat(0xeaf7ff,.15),x,1.25,-2.72));
 g.add(box(1.0,.32,.12,black,0,.92,-2.76));
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 return g;
}

const player=makeTT();player.position.set(0,0,trackRadius);player.rotation.y=Math.PI;scene.add(player);
let roofOpen=false;
function setRoof(open){
 roofOpen=open;
 player.children.forEach((o)=>{ if(o.geometry && o.geometry.type==='CapsuleGeometry') o.visible=!open; });
}
const opponents=[];
[[1.8,0xd7d9dc],[ -2.0,0x1e2936],[0,0x9b1f1f]].forEach((cfg,i)=>{
 const c=makeTT(cfg[1]);c.scale.setScalar(.82);c.position.set(cfg[0],0,trackRadius+9+i*7);scene.add(c);opponents.push({car:c,a:Math.PI/2,spd:1.7+i*.18,offset:cfg[0]});
});

let keys={},running=false,paused=false,night=false,lap=1,timer=0,last=performance.now(),distance=0,steer=0;
addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 if(e.code==='KeyR'&&!e.repeat)setRoof(!roofOpen);
 if(e.code==='KeyN'&&!e.repeat){night=!night;scene.background.set(night?0x101b2e:0x8bc9ee);scene.fog.color.set(night?0x101b2e:0x8bc9ee);sun.intensity=night?.35:2.2}
 if(e.code==='Escape'&&!e.repeat)paused=!paused;
});
addEventListener('keyup',e=>keys[e.code]=false);

const start=document.getElementById('start'),go=document.getElementById('go'),count=document.getElementById('count'),msg=document.getElementById('msg');
go.onclick=()=>{
 let n=3;count.textContent=n;
 const t=setInterval(()=>{n--;count.textContent=n>0?n:'GO!';if(n<0){clearInterval(t);start.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}},700);
};

function playerTrack(){
 const r=trackRadius;
 const a=distance/r;
 player.position.set(Math.cos(a)*r,0.08,Math.sin(a)*r);
 player.rotation.y=-a+Math.PI/2+steer*.16;
}
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.035,(now-last)/1000);last=now;
 if(running&&!paused){
   const gas=keys.KeyW||keys.ArrowUp,br=keys.KeyS||keys.ArrowDown;
   if(gas)distance+=dt*(14+Math.max(0,speed())*.055);
   if(br)distance=Math.max(0,distance-dt*7);
   const target=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
   steer+=(target-steer)*Math.min(1,dt*7);
   timer+=dt;
   playerTrack();
   opponents.forEach((o,i)=>{
     o.a+=dt*(o.spd/trackRadius);
     const rr=trackRadius+(i===0?3.0:-2.7);
     o.car.position.set(Math.cos(o.a)*rr,0.08,Math.sin(o.a)*rr);
     o.car.rotation.y=-o.a+Math.PI/2;
   });
   const lapNow=Math.floor(distance/(2*Math.PI*trackRadius))+1;
   if(lapNow>lap){lap=Math.min(3,lapNow);document.getElementById('lap').textContent=lap+'/3'}
   if(distance>=2*Math.PI*trackRadius*3){running=false;msg.textContent='🏆 ZIEL!';msg.style.display='block'}
 }
 const kmh=Math.round((14+Math.max(0,distance%30)*2.1)*(keys.KeyW||keys.ArrowUp?2.8:.35));
 document.getElementById('speed').textContent=Math.min(260,kmh);
 document.getElementById('timer').textContent=timer.toFixed(1);
 camera.position.lerp(new THREE.Vector3(player.position.x,3.1,player.position.z),.12);
 const look=new THREE.Vector3(Math.cos(-player.rotation.y)*8,1.25,Math.sin(-player.rotation.y)*8);
 look.add(player.position);camera.lookAt(look);
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.render(scene,camera);
</script>
</body>
</html>
