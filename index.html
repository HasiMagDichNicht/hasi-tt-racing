<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HASI TT 8N Racing – PC</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#081018;font-family:Arial,sans-serif;color:#fff}
#world{position:fixed;inset:0;background:linear-gradient(#6ea8ce 0 44%,#486f43 44% 100%)}
.mountain{position:absolute;bottom:32%;width:0;height:0;border-left:27vw solid transparent;border-right:27vw solid transparent;border-bottom:29vw solid #536b6c}
.m1{left:-17vw}.m2{left:25vw;transform:scale(.78);border-bottom-color:#657b7c}.m3{left:62vw;transform:scale(.62);border-bottom-color:#4d6264}
#road{position:absolute;left:50%;bottom:-17%;width:105%;height:92%;transform:translateX(-50%) perspective(500px) rotateX(58deg);background:#303235;clip-path:polygon(31% 0,69% 0,100% 100%,0 100%);box-shadow:0 -4px 0 #777}
#lane{position:absolute;left:50%;top:0;width:7px;height:100%;transform:translateX(-50%);background:repeating-linear-gradient(#f5efd7 0 7%,transparent 7% 14%)}
.curbs{position:absolute;top:0;bottom:0;width:5%;background:repeating-linear-gradient(#eee 0 7%,#d21e2a 7% 14%);opacity:.9}
#curbL{left:26%}#curbR{right:26%}
#car{position:absolute;left:50%;bottom:17%;width:220px;height:145px;transform:translateX(-50%);z-index:5;filter:drop-shadow(0 22px 9px #0008)}
.body{position:absolute;left:18px;bottom:15px;width:184px;height:72px;background:linear-gradient(#25282b,#050607 72%);border-radius:31px 31px 15px 15px;box-shadow:inset 0 5px 10px #fff2}
.hood{position:absolute;left:43px;bottom:68px;width:139px;height:38px;background:#111315;border-radius:28px 26px 8px 8px;transform:skewX(-8deg)}
.cabin{position:absolute;left:62px;bottom:78px;width:98px;height:49px;background:#16242d;clip-path:polygon(14% 100%,25% 8%,75% 8%,90% 100%);border:2px solid #111}
.wind{position:absolute;left:77px;bottom:87px;width:67px;height:30px;background:linear-gradient(145deg,#46606e,#101920);clip-path:polygon(14% 100%,25% 0,75% 0,90% 100%)}
.roll{position:absolute;left:79px;bottom:126px;width:55px;height:16px;border-top:5px solid #bbb;border-radius:50%}
.wheel{position:absolute;bottom:-3px;width:42px;height:42px;border-radius:50%;background:#0b0c0e;border:7px solid #26292c;box-shadow:inset 0 0 0 5px #aaa}
.w1{left:25px}.w2{right:25px}
.light{position:absolute;bottom:52px;width:30px;height:11px;background:#d9efff;box-shadow:0 0 16px #9bd5ff;border-radius:50%}.l1{left:36px}.l2{right:36px}
.plate{position:absolute;left:83px;bottom:27px;width:53px;height:13px;background:#eee;color:#111;text-align:center;font:bold 9px Arial;line-height:13px;border-radius:2px}
#hud{position:fixed;top:16px;left:18px;right:18px;z-index:20;display:flex;justify-content:space-between;pointer-events:none}
.pill{background:#071018c9;border:1px solid #fff3;padding:10px 14px;border-radius:13px;font-weight:700}
#speed{font-size:24px}
#start{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0007;backdrop-filter:blur(5px)}
.card{width:430px;max-width:90vw;padding:30px;border-radius:25px;background:#0a1119ed;border:1px solid #fff2;text-align:center;box-shadow:0 30px 90px #0009}
.card h1{font-size:34px;margin:0 0 8px}.card p{opacity:.78;line-height:1.5}
#go{border:0;border-radius:14px;padding:15px 30px;font-size:17px;font-weight:800;cursor:pointer}
#help{position:fixed;left:18px;bottom:18px;z-index:15;background:#071018bb;padding:10px 14px;border-radius:12px;font-size:13px;color:#ddd}
.night{filter:brightness(.58) saturate(.8)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
</style>
</head>
<body>
<div id="world">
 <div class="mountain m1"></div><div class="mountain m2"></div><div class="mountain m3"></div>
 <div id="road"><div id="lane"></div><div id="curbL" class="curbs"></div><div id="curbR" class="curbs"></div></div>
 <div id="car"><div class="body"></div><div class="hood"></div><div class="cabin"></div><div class="wind"></div><div class="roll"></div><div class="wheel w1"></div><div class="wheel w2"></div><div class="light l1"></div><div class="light l2"></div><div class="plate">HASI</div></div>
</div>
<div id="hud"><div class="pill">🏁 Runde <span id="lap">1/3</span> · <span id="time">00:00.0</span></div><div class="pill"><span id="speed">0</span> km/h</div></div>
<div id="help">W / ↑ Gas · S / ↓ Bremse · A,D / ←,→ Lenken · R Dach · N Nacht · ESC Pause</div>
<div id="flash"></div>
<div id="start"><div class="card"><h1>🏁 HASI TT 8N</h1><p>PC-Version<br>Schwarzer TT Roadster · Kennzeichen HASI</p><button id="go">FAHRT STARTEN</button></div></div>
<script>
const car=document.getElementById('car'), start=document.getElementById('start'), world=document.getElementById('world');
const speedEl=document.getElementById('speed'), timeEl=document.getElementById('time'), flash=document.getElementById('flash');
let started=false,paused=false,speed=0,steer=0,time=0,last=performance.now(),roof=false;
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.code==='KeyR'&&!e.repeat) roof=!roof;
  if(e.code==='KeyN'&&!e.repeat) world.classList.toggle('night');
  if(e.code==='Escape'&&!e.repeat) paused=!paused;
});
addEventListener('keyup',e=>keys[e.code]=false);
document.getElementById('go').onclick=()=>{started=true;start.style.display='none';last=performance.now();requestAnimationFrame(loop)};

function loop(now){
 if(!started)return;
 const dt=Math.min(.04,(now-last)/1000); last=now;
 if(!paused){
   const gas=keys.KeyW||keys.ArrowUp, brake=keys.KeyS||keys.ArrowDown;
   const left=keys.KeyA||keys.ArrowLeft, right=keys.KeyD||keys.ArrowRight;
   if(gas)speed+=135*dt; else speed-=24*dt;
   if(brake)speed-=190*dt;
   if(keys.Space)speed-=260*dt;
   speed=Math.max(0,Math.min(240,speed));
   const target=(right?1:0)-(left?1:0);
   steer+=(target-steer)*Math.min(1,dt*8);
   car.style.left='calc(50% + '+(steer*95)+'px)';
   car.style.transform='translateX(-50%) rotateZ('+(-steer*2.5)+'deg)';
   document.getElementById('lane').style.transform='translateX(calc(-50% + '+steer*38+'px))';
   time+=dt;
   speedEl.textContent=Math.round(speed);
   timeEl.textContent=time.toFixed(1).padStart(4,'0');
 }
 requestAnimationFrame(loop);
}
</script>
</body>
</html>
